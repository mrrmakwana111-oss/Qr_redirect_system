<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting...</title>
  <script>
    // Jab bhi destination badalna ho, bas neeche ka link badal kar GitHub mein save kar
    const TARGET_URL = "https://example.com/your-live-review-page";
    window.location.replace(TARGET_URL);
  </script>
</head>
<body>
  <p>Redirecting... <a id="fallback-link" href="https://example.com/your-live-review-page">Click here</a></p>
  <script>
    document.getElementById("fallback-link").href = TARGET_URL;
  </script>
</body>
</html>
