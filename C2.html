<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VBike Ahmedabad — Quick Review</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body {
      margin: 0;
      background: #0f172a;
      color: #f8fafc;
      padding: 18px;
    }
    .card {
      max-width: 460px;
      margin: 0 auto;
      background: #1e293b;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }
    h1 { margin: 0 0 4px; font-size: 20px; color: #38bdf8; }
    .sub { font-size: 13px; color: #cbd5e1; margin-bottom: 16px; }
    .label { font-size: 13px; font-weight: bold; margin: 12px 0 8px; display: block; color: #e2e8f0; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      border: 1px solid #475569;
      background: #0f172a;
      color: #e2e8f0;
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 12px;
      cursor: pointer;
    }
    .chip.active {
      background: #0284c7;
      border-color: #38bdf8;
      color: #fff;
      font-weight: bold;
    }
    select, textarea {
      width: 100%;
      border-radius: 10px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      padding: 10px;
      font-size: 14px;
    }
    textarea { min-height: 110px; margin-top: 10px; resize: vertical; }
    .btn-row { display: flex; gap: 10px; margin-top: 12px; }
    button.action {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
    }
    .btn-gen { background: #22c55e; color: #052e16; width: 100%; margin-top: 12px; }
    .btn-copy { background: #38bdf8; color: #082f49; }
    .btn-maps {
      background: #f59e0b;
      color: #451a03;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1;
      border-radius: 10px;
      font-weight: bold;
      font-size: 14px;
      padding: 12px;
    }
    .status { font-size: 12px; color: #4ade80; margin-top: 8px; min-height: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>VBike Ahmedabad</h1>
    <div class="sub">Electric Scooter Showroom • Chandkheda — Share your quick experience</div>

    <span class="label">1. What stood out for you?</span>
    <div class="chips" id="points">
      <div class="chip active" data-val="polite and helpful staff">Polite Staff</div>
      <div class="chip active" data-val="clear and transparent pricing">Transparent Pricing</div>
      <div class="chip" data-val="smooth electric scooter test ride">Smooth Test Ride</div>
      <div class="chip" data-val="smart features like GPS tracking and anti-theft alerts">GPS & Anti-Theft</div>
      <div class="chip" data-val="timely delivery and hassle-free buying process">Smooth Delivery</div>
    </div>

    <span class="label">2. Style / Tone</span>
    <select id="tone">
      <option value="friendly">Friendly & Natural</option>
      <option value="short">Short & Crisp</option>
      <option value="detailed">Detailed & Helpful</option>
    </select>

    <button class="action btn-gen" onclick="generateReview()">Generate Review Draft</button>

    <span class="label">3. Your Review (Edit if needed)</span>
    <textarea id="reviewBox"></textarea>
    <div class="status" id="statusMsg"></div>

    <div class="btn-row">
      <button class="action btn-copy" onclick="copyReview()">Copy Review</button>
      <!-- Apna exact Google Review URL yahan daal -->
      <a class="btn-maps" id="mapsLink" href="https://maps.app.goo.gl/rQYvKqzaCyReJ3jz5?g_st=ac" target="_blank" rel="noopener">
        Open Google Maps
      </a>
    </div>
  </div>

  <script>
    const chips = document.querySelectorAll(".chip");
    chips.forEach(chip => {
      chip.addEventListener("click", () => {
        chip.classList.toggle("active");
        generateReview();
      });
    });

    document.getElementById("tone").addEventListener("change", generateReview);

    function generateReview() {
      const selected = Array.from(document.querySelectorAll(".chip.active")).map(c => c.dataset.val);
      const tone = document.getElementById("tone").value;
      const highlights = selected.length ? selected.join(", ") : "great overall service";

      let text = "";
      if (tone === "short") {
        text = `Visited VBike Ahmedabad in Chandkheda. Really liked the ${highlights}. Recommended for electric scooters!`;
      } else if (tone === "detailed") {
        text = `Had a great experience visiting VBike Ahmedabad in Chandkheda. The team guided me properly and I especially appreciated the ${highlights}. If you are looking for an electric scooter in Ahmedabad, it is definitely worth checking out.`;
      } else {
        text = `Great experience at VBike Ahmedabad, Chandkheda! Loved the ${highlights}. Very smooth experience overall.`;
      }

      document.getElementById("reviewBox").value = text;
      document.getElementById("statusMsg").textContent = "";
    }

    function copyReview() {
      const box = document.getElementById("reviewBox");
      box.select();
      box.setSelectionRange(0, 99999);
      navigator.clipboard?.writeText(box.value);
      document.getElementById("statusMsg").textContent = "Review copied! Now tap 'Open Google Maps' and paste it.";
    }

    generateReview();
  </script>
</body>
  </html>
